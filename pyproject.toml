[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "episodeaudit"
version = "1.0.0"
description = "Evidence-aware manifest, sampling-exposure, and grouped prediction audits"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Xin Li"}, {name = "Bojian Guo"}, {name = "Asel Kartanova"}]
dependencies = ["numpy>=1.24,<3"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent", "Topic :: Scientific/Engineering"]

[project.scripts]
episodeaudit = "episodeaudit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
